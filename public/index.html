<!doctype html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="El yazisi Ingilizce mektuplari fotograf uzerinde duzeltin.">
  <title>Mektup Düzeltici</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="shell">
    <section class="workspace">
      <div id="dropzone" class="dropzone" tabindex="0" role="button" aria-label="Fotoğraf yükle">
        <input id="fileInput" type="file" accept="image/jpeg,image/png,image/webp" hidden>
        <h2>Mektup fotoğrafını yükle</h2>
        <button id="chooseButton" class="button primary" type="button">Fotoğraf seç</button>
      </div>

      <div id="editor" class="editor" hidden>
        <div class="editor-topbar">
          <div>
            <span class="step">Fotoğraf hazır</span>
            <strong id="fileName"></strong>
          </div>
          <button id="changeButton" class="text-button" type="button">Değiştir</button>
        </div>
        <div class="comparison-grid single-result">
          <article class="result-panel">
            <div class="result-heading"><div><span class="engine-dot gemini"></span><strong>Google Gemini</strong></div><small>Google OCR</small></div>
            <div class="canvas-wrap"><canvas id="geminiCanvas"></canvas></div>
            <div id="geminiStatus" class="engine-status" aria-live="polite"></div>
            <button id="geminiDownloadButton" class="button secondary panel-download" type="button" hidden>Gemini sonucunu indir <span>↓</span></button>
            <button id="geminiTranscriptButton" class="button secondary panel-download" type="button" hidden>Metin olarak göster</button>
            <div id="geminiCorrectionList" class="correction-list compact output-details" hidden></div>
          </article>
        </div>
        <div id="status" class="status" aria-live="polite"></div>
        <div class="actions">
          <button id="correctButton" class="button primary wide" type="button">Gemini ile düzelt <span>→</span></button>
        </div>
      </div>
    </section>

    <div id="transcriptOverlay" class="transcript-overlay" hidden>
      <div class="transcript-sheet">
        <div class="transcript-toolbar no-print">
          <button id="transcriptPrintButton" class="button secondary" type="button">Yazdır / PDF kaydet</button>
          <button id="transcriptCloseButton" class="button secondary" type="button">Kapat</button>
        </div>
        <div id="transcriptText" class="transcript-page"></div>
      </div>
    </div>
  </main>
  <script src="/app.js" defer></script>
</body>
</html>
